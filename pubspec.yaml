name: bems_farms
description: A new Flutter project for BemsFarms.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client for REST API calls
  http: ^1.2.1

  # Encrypted JWT storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.0.0

  # Onboarding seen flag storage
  shared_preferences: ^2.2.3
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.3
  sign_in_button: ^5.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.1.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  url_launcher: ^6.3.3
  socket_io_client: ^3.1.6
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
